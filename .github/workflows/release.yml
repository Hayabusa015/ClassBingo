name: Release desktop app

# Builds the Windows installer and publishes it to a GitHub Release
# whenever a version tag (v1.2.3) is pushed — e.g. via `npm run release:patch`.
# electron-updater in the installed app checks this repo's latest published
# Release on every launch, so once this workflow finishes, every existing
# install offers to update itself the next time it's opened.
on:
  push:
    tags:
      - 'v*'
  # Lets a release be cut by hand (e.g. from a session that can't push a
  # tag directly) — it tags the current package.json version itself.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test

      - name: Ensure a release tag exists for this version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — building it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Ensure the GitHub release exists
        shell: bash
        # electron-builder uploads the installer and its .blockmap in
        # parallel; if neither the release nor a differential base exists
        # yet, both uploads race to create it and the loser 422s. Creating
        # it up front (idempotently) removes the race entirely.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - name: Package and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
